# DevOS migration workflow: W-C02-03, the build of evidence/C02/EV-C02-001_migration_path.md (section 5, "The job's
# shape"); build record evidence/C02/EV-C02-007_migration_path_build.md. Class high (tools/merge_gate.py).
# On a push to main: devos-test (apply, compare, tests), then devos (compare, decide, apply, compare again), in that
# order, with devos applied only on devos-test's go = yes and its own comparison (M07). On the schedule: compare and
# search only, in each project. The only workflow that names the environments migrate-devos-test and migrate-devos;
# no other event starts it (M04). The credential reaches only the steps that connect (M21). Nothing reads under
# supabase/ but supabase/migrations/ (Y-09; supabase/functions/ only for its existence, until N-230). Every connection
# authenticates the server (sslmode=verify-full against the pinned Supabase Root 2021 CA), and the password reaches a
# program only through its environment (PGPASSWORD), never its arguments (security F5, F6; EV-C02-007 section 11).
name: migrate

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"

permissions: {}

concurrency:
  # One group for this workflow's runs (M06), named for its file and the two environments it serves (security F11).
  # Groups are repository-wide, so another workflow can still name it: the residual is in EV-C02-007 section 11.
  group: devos-migrate.yml-migrate-devos-test-migrate-devos
  cancel-in-progress: false
  queue: max

env:
  CLI_VERSION: "2.120.0"
  CLI_SHA256: "7074584113aa00495beeac661c41fb09f1ddd0a483cd7333894b0d080086dc6e"
  # The Supabase Root 2021 CA (prod-ca-2021.crt; self-signed, valid to 2031-04-26), the root of the pooler's chain; its
  # source and fetch date are in EV-C02-007 section 11. Step rootca writes it to PGSSLROOTCERT only if the SHA-256 of its
  # DER is W03_ROOT_CA_SHA256.
  W03_ROOT_CA_SHA256: "807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa"
  W03_ROOT_CA_PEM: |
    -----BEGIN CERTIFICATE-----
    MIIDxDCCAqygAwIBAgIUbLxMod62P2ktCiAkxnKJwtE9VPYwDQYJKoZIhvcNAQEL
    BQAwazELMAkGA1UEBhMCVVMxEDAOBgNVBAgMB0RlbHdhcmUxEzARBgNVBAcMCk5l
    dyBDYXN0bGUxFTATBgNVBAoMDFN1cGFiYXNlIEluYzEeMBwGA1UEAwwVU3VwYWJh
    c2UgUm9vdCAyMDIxIENBMB4XDTIxMDQyODEwNTY1M1oXDTMxMDQyNjEwNTY1M1ow
    azELMAkGA1UEBhMCVVMxEDAOBgNVBAgMB0RlbHdhcmUxEzARBgNVBAcMCk5ldyBD
    YXN0bGUxFTATBgNVBAoMDFN1cGFiYXNlIEluYzEeMBwGA1UEAwwVU3VwYWJhc2Ug
    Um9vdCAyMDIxIENBMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqQXW
    QyHOB+qR2GJobCq/CBmQ40G0oDmCC3mzVnn8sv4XNeWtE5XcEL0uVih7Jo4Dkx1Q
    DmGHBH1zDfgs2qXiLb6xpw/CKQPypZW1JssOTMIfQppNQ87K75Ya0p25Y3ePS2t2
    GtvHxNjUV6kjOZjEn2yWEcBdpOVCUYBVFBNMB4YBHkNRDa/+S4uywAoaTWnCJLUi
    cvTlHmMw6xSQQn1UfRQHk50DMCEJ7Cy1RxrZJrkXXRP3LqQL2ijJ6F4yMfh+Gyb4
    O4XajoVj/+R4GwywKYrrS8PrSNtwxr5StlQO8zIQUSMiq26wM8mgELFlS/32Uclt
    NaQ1xBRizkzpZct9DwIDAQABo2AwXjALBgNVHQ8EBAMCAQYwHQYDVR0OBBYEFKjX
    uXY32CztkhImng4yJNUtaUYsMB8GA1UdIwQYMBaAFKjXuXY32CztkhImng4yJNUt
    aUYsMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAB8spzNn+4VU
    tVxbdMaX+39Z50sc7uATmus16jmmHjhIHz+l/9GlJ5KqAMOx26mPZgfzG7oneL2b
    VW+WgYUkTT3XEPFWnTp2RJwQao8/tYPXWEJDc0WVQHrpmnWOFKU/d3MqBgBm5y+6
    jB81TU/RG2rVerPDWP+1MMcNNy0491CTL5XQZ7JfDJJ9CCmXSdtTl4uUQnSuv/Qx
    Cea13BX2ZgJc7Au30vihLhub52De4P/4gonKsNHYdbWjg7OWKwNv/zitGDVDB9Y2
    CMTyZKG3XEu5Ghl1LEnI3QmEKsqaCLv12BnVjbkSeZsMnevJPs1Ye6TjjJwdik5P
    o/bKiIz+Fq8=
    -----END CERTIFICATE-----
  W03_POOLER_CANDIDATES: "aws-0-us-east-1.pooler.supabase.com aws-0-us-east-2.pooler.supabase.com aws-0-us-west-1.pooler.supabase.com aws-0-us-west-2.pooler.supabase.com aws-0-ca-central-1.pooler.supabase.com aws-0-sa-east-1.pooler.supabase.com aws-0-eu-west-1.pooler.supabase.com aws-0-eu-west-2.pooler.supabase.com aws-0-eu-west-3.pooler.supabase.com aws-0-eu-central-1.pooler.supabase.com aws-0-eu-central-2.pooler.supabase.com aws-0-eu-north-1.pooler.supabase.com aws-0-ap-south-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-2.pooler.supabase.com aws-0-ap-northeast-1.pooler.supabase.com aws-0-ap-northeast-2.pooler.supabase.com aws-1-us-east-1.pooler.supabase.com aws-1-us-east-2.pooler.supabase.com aws-1-us-west-1.pooler.supabase.com aws-1-us-west-2.pooler.supabase.com aws-1-ca-central-1.pooler.supabase.com aws-1-sa-east-1.pooler.supabase.com aws-1-eu-west-1.pooler.supabase.com aws-1-eu-west-2.pooler.supabase.com aws-1-eu-west-3.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com aws-1-eu-central-2.pooler.supabase.com aws-1-eu-north-1.pooler.supabase.com aws-1-ap-south-1.pooler.supabase.com aws-1-ap-southeast-1.pooler.supabase.com aws-1-ap-southeast-2.pooler.supabase.com aws-1-ap-northeast-1.pooler.supabase.com aws-1-ap-northeast-2.pooler.supabase.com"
  W03_EXCLUDED_SCHEMAS: "auth extensions graphql graphql_public pgbouncer realtime storage vault supabase_migrations"
  W03_SCHEMA_ENTRY_ONLY: "public"
  W03_EXCLUDED_ROLES: "postgres authenticator service_role anon authenticated dashboard_user pgbouncer pgsodium_keyholder pgsodium_keyiduser pgsodium_keymaker supabase_admin supabase_auth_admin supabase_functions_admin supabase_read_only_user supabase_realtime_admin supabase_replication_admin supabase_storage_admin supabase_etl_admin supabase_privileged_role"
  W03_TOKEN_CLASSES: "devos_kurulum devos_calisma devos_denetim devos_sinav devos_ci devos_backup"  # EV-C02-003 section 4.1's columns; the first also gives the revoked token
  W03_PLANT_B64: ""
  W03_FIXTURE_ISSUE: ""
  W03_CLI_CONFIG: |
    # Written by .github/workflows/migrate.yml; the job reads no configuration from the repository (Y-09).
    project_id = "devos-migrate"
    [db.migrations]
    enabled = true
    [db.seed]
    enabled = false

jobs:
  devos-test:
    name: devos-test (apply, compare, test)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: migrate-devos-test
    permissions:
      contents: read
    env:
      PROJECT: devos-test
      PROJECT_REF: cqbzxexxwrrbrlszoseg
      POOLER_HOST: "aws-0-us-east-1.pooler.supabase.com"  # P3: found by run 38315433827 (2026-10-12) without the credential; EV-C02-007 section 13
      PGPORT: "5432"
      PGUSER: postgres.cqbzxexxwrrbrlszoseg
      PGDATABASE: postgres
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tmp/w03-supabase-root-2021-ca.crt  # written by step rootca, after its pin is checked
      PGCONNECT_TIMEOUT: "15"
      PGAPPNAME: devos-migrate
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    outputs:
      go: ${{ steps.go.outputs.go }}
    steps:
      - id: head
        name: "(1) head check: act only at main's head (M05)"
        shell: bash
        run: |
          main_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)" || main_head=""
          if [ -z "$main_head" ]; then
            echo "head check: could not check (main's head could not be read); nothing connects"
            echo "head=unknown" >> "$GITHUB_OUTPUT"
          elif [ "$main_head" = "$GITHUB_SHA" ]; then
            echo "head check: yes (this run's commit ${GITHUB_SHA} is main's head)"
            echo "head=yes" >> "$GITHUB_OUTPUT"
          else
            echo "head check: superseded (this run's commit ${GITHUB_SHA}; main's head ${main_head}); nothing connects"
            echo "head=superseded" >> "$GITHUB_OUTPUT"
          fi
      - id: checkout
        name: "check out this commit (no credential kept)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0, a commit of actions/checkout (P12)
        with:
          persist-credentials: false
      - id: cli
        name: "install the command-line tool, its checksum checked (M20, P12)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "command-line tool v${CLI_VERSION}: could not check (a command of this step failed, line ${LINENO}); no step that runs it runs"' ERR
          d="$RUNNER_TEMP/w03cli"
          rm -rf "$d"
          mkdir -p "$d"
          if ! curl -fsSL --proto '=https' --tlsv1.2 -o "$d/cli.tar.gz" \
              "https://github.com/supabase/cli/releases/download/v${CLI_VERSION}/supabase_linux_amd64.tar.gz"; then
            echo "command-line tool v${CLI_VERSION}: could not check (the download failed); it is not extracted, and no step that runs it runs"
            exit 1
          fi
          if ! printf '%s  %s\n' "$CLI_SHA256" "$d/cli.tar.gz" | sha256sum --check --status; then
            echo "command-line tool v${CLI_VERSION}: checksum MISMATCH; the tool is not extracted, and no step that runs it runs"
            exit 1
          fi
          echo "command-line tool v${CLI_VERSION}: checksum matches the release's published SHA-256 ${CLI_SHA256}"
          if ! tar -xzf "$d/cli.tar.gz" -C "$d" supabase supabase-go; then
            echo "command-line tool v${CLI_VERSION}: could not check (the archive did not extract); no step that runs it runs"
            exit 1
          fi
          echo "path=$d/supabase" >> "$GITHUB_OUTPUT"
      - id: workdir
        name: "build the tool's working directory; expected from main's head (M08, M14, Y-09)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "expected: could not check (a command of this step failed, line ${LINENO})"' ERR
          w="$RUNNER_TEMP/w03work"
          rm -rf "$w"
          mkdir -p "$w/supabase/migrations"
          printf '%s\n' "$W03_CLI_CONFIG" > "$w/supabase/config.toml"
          python3 -I - "$w" <<'PY'
          # M08 and Y-09: the command-line tool runs in a directory this step builds: the workflow's own configuration and
          # copies of the top-level migration files only. M14: `expected` from the same files at this commit (main's head).
          import json, os, re, shutil, sys
          w = sys.argv[1]
          src = "supabase/migrations"
          pattern = re.compile(r"([0-9]+)_(.*)\.sql")
          migrations, problems = [], []
          if os.path.lexists("supabase/functions"):
              problems.append("supabase/functions/ exists; its part of the comparison comes with the first Edge Function (N-230)")
          for name in sorted(os.listdir(src)) if os.path.isdir(src) else []:
              path = os.path.join(src, name)
              if os.path.islink(path):
                  problems.append(f"{path} is a symbolic link")
              elif os.path.isdir(path):
                  continue  # subdirectories (tests/) hold no migrations
              elif not pattern.fullmatch(name):
                  problems.append(f"{path} is a top-level file that is not a migration (<version>_<name>.sql)")
              else:
                  match = pattern.fullmatch(name)
                  shutil.copyfile(path, os.path.join(w, "supabase", "migrations", name))
                  migrations.append({"version": match.group(1), "name": match.group(2)})
          versions = [m["version"] for m in migrations]
          if len(set(versions)) != len(versions):
              problems.append("two migration files share a version")
          print("working directory of the command-line tool (names only):")
          for root, _, files in sorted(os.walk(w)):
              for f in sorted(files):
                  print("  " + os.path.relpath(os.path.join(root, f), w))
          expected = "" if problems else json.dumps(
              {"commit": os.environ["GITHUB_SHA"], "migrations": migrations, "functions": []}, separators=(",", ":"))
          for p in problems:
              print("expected: could not check: " + p)
          print(f"expected: {len(migrations)} migrations on main at {os.environ['GITHUB_SHA']}: {versions}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dir={w}\nexpected<<W03EOF\n{expected}\nW03EOF\n")
          PY
      - id: rootca
        name: "server authentication: the pinned root certificate, written only if its SHA-256 matches (security F5)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          python3 -I - <<'PY' || exit $?
          # Every connection of this job uses sslmode=verify-full against the root file PGSSLROOTCERT names (the job's env).
          # That root is the Supabase Root 2021 CA, kept in this workflow (W03_ROOT_CA_PEM) and pinned by the SHA-256 of its
          # DER (W03_ROOT_CA_SHA256). The file is written only if the PEM holds exactly one certificate with that SHA-256,
          # and it is written from that DER, so it holds nothing else. Otherwise no file exists, and nothing connects:
          # libpq and the command-line tool both refuse a missing root file under verify-full.
          import hashlib, os, ssl
          path, pin = os.environ["PGSSLROOTCERT"], os.environ.get("W03_ROOT_CA_SHA256", "")
          if os.path.lexists(path):
              os.remove(path)
          pem = os.environ.get("W03_ROOT_CA_PEM", "").strip()
          try:
              if pem.count("-----BEGIN") != 1:
                  raise ValueError("the PEM does not hold exactly one certificate")
              der = ssl.PEM_cert_to_DER_cert(pem)
          except ValueError as exc:
              print(f"server root certificate: could not check ({exc}); no file is written, and nothing connects")
              raise SystemExit(1)
          got = hashlib.sha256(der).hexdigest()
          if got != pin:
              print(f"server root certificate: could not check: the SHA-256 of its DER is {got}, not the pin {pin}; "
                    f"no file is written, and nothing connects")
              raise SystemExit(1)
          with open(path, "x", encoding="ascii") as f:
              f.write(ssl.DER_cert_to_PEM_cert(der))
          with open(path, encoding="ascii") as f:
              back = f.read().strip()
          if back.count("-----BEGIN") != 1 or hashlib.sha256(ssl.PEM_cert_to_DER_cert(back)).hexdigest() != pin:
              os.remove(path)
              print("server root certificate: could not check (the file written does not read back as the pinned "
                    "certificate); it is removed, and nothing connects")
              raise SystemExit(1)
          print(f"server root certificate: the SHA-256 of its DER, {got}, matches the pin; written to {path}")
          PY
      - id: pooler
        name: "find the pooler host without the credential (P3)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          if [ -n "$POOLER_HOST" ]; then
            echo "pooler host (P3): ${POOLER_HOST} (recorded in the workflow)"
            echo "host=${POOLER_HOST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pooler host (P3): not recorded in the workflow; looking for it without the credential"
          found=""
          answers="$RUNNER_TEMP/w03pooler.answers"
          : > "$answers"
          for h in $W03_POOLER_CANDIDATES; do
            msg="$(env -u PGPASSWORD PGHOST="$h" timeout 20 psql -X -w -A -t -c 'select 1' 2>&1 >/dev/null)" && rc=0 || rc=$?
            printf '%s\0%s\0%s\0' "$h" "$rc" "$msg" >> "$answers"
            case "$msg" in
              *"Tenant or user not found"*) ;;
              *password*) found="$h"; break ;;
            esac
          done
          python3 -I - "$answers" <<'PY' || echo "pooler host (P3): the candidates' answers could not be listed"
          # The distinct answers the candidates gave (CHK-C02-029 F-2): each once, with how many gave it and the first that did,
          # the host and its address replaced, escaped. So a run that finds none tells a chain that does not verify against the
          # pinned root ("certificate verify failed") from no region holding the project ("Tenant or user not found"), from a
          # timeout (exit 124) and from a name that does not resolve. This step holds no secret.
          import re, sys
          fields = open(sys.argv[1], "rb").read().decode("utf-8", "replace").split("\0")
          kinds = {}
          for i in range(0, len(fields) - 2, 3):
              host, rc, msg = fields[i:i + 3]
              text = re.sub(r"\((?:[0-9]{1,3}\.){3}[0-9]{1,3}\)|\([0-9a-fA-F]*:[0-9a-fA-F:]*\)", "(<address>)",
                            msg.replace(host, "<host>"))
              kinds.setdefault(f"exit {rc}: " + (" ".join(text.split()) or "(no message)"), []).append(host)
          for kind, hosts in kinds.items():
              shown = "".join(c if c.isprintable() else ascii(c)[1:-1] for c in kind)[:300]
              print(f"pooler host (P3): {len(hosts)} candidate(s) answered, the first {hosts[0]}: {shown}")
          PY
          echo "pooler host (P3): found ${found:-none}; it is not used until it is recorded in the workflow (EV-C02-001 M19)"
          echo "host=" >> "$GITHUB_OUTPUT"
          exit 1
      - id: tls
        name: "server authentication: two negative controls, without the credential, before it is used (security F5)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
        shell: bash
        run: |
          set -uo pipefail
          python3 -I - <<'PY' || exit $?
          # The first-run controls of server authentication, before any step that holds the credential connects. Neither
          # control holds the password (PGPASSWORD removed, psql -w), so one that wrongly connects reaches at most the
          # server's password request. Each keeps this job's own PGSSLMODE and PGSSLROOTCERT but for the one part it
          # changes: (a) a root made at run time in place of the pinned one must give "certificate verify failed"; (b) a
          # host name the certificate does not cover, at the pooler's own address (hostaddr), must give "does not match
          # host name". The positive control is step connect (select 1, with the credential). If a control is not refused
          # for its reason, server authentication is not shown: the root file is removed, so no later step can connect,
          # and this step fails, so the apply does not run. Each control prints one line, holding no secret.
          import os, socket, subprocess, tempfile


          def esc(s):
              return "".join(c if c.isprintable() else ascii(c)[1:-1] for c in s)


          def control(label, change, marker):
              env = {k: v for k, v in os.environ.items() if k != "PGPASSWORD"}
              env.update(change)
              try:
                  r = subprocess.run(["psql", "-X", "-w", "-A", "-t", "-c", "select 1"], env=env, stdin=subprocess.DEVNULL,
                                     capture_output=True, text=True, timeout=60)
                  rc, msg = r.returncode, " ".join((r.stdout + r.stderr).split())
              except (OSError, subprocess.TimeoutExpired) as exc:
                  rc, msg = None, type(exc).__name__
              if rc == 0:
                  line = "FAIL (it connected)"
              elif rc is not None and marker in msg:
                  line = f"pass (refused: {marker})"
              else:
                  line = f"FAIL (not refused for that reason: {esc(msg)[:240]})"
              print(f"server authentication, negative control {label}: {line}", flush=True)
              return line.startswith("pass")


          root, host = os.environ["PGSSLROOTCERT"], os.environ.get("PGHOST", "")
          a = b = False
          if not host or not os.path.isfile(root):
              print("server authentication: could not check (no pooler host, or no pinned root file)")
          else:
              with tempfile.TemporaryDirectory() as d:
                  made = subprocess.run(["openssl", "req", "-x509", "-newkey", "ec", "-pkeyopt", "ec_paramgen_curve:prime256v1",
                                         "-nodes", "-keyout", d + "/runtime-root.key", "-out", d + "/runtime-root.crt",
                                         "-days", "1", "-subj", "/CN=w03 run-time root"], capture_output=True).returncode == 0
                  if made:
                      a = control("(a), a root made at run time in place of the pinned one",
                                  {"PGSSLROOTCERT": d + "/runtime-root.crt"}, "certificate verify failed")
                  else:
                      print("server authentication, negative control (a): FAIL (openssl could not make the run-time root)")
              try:
                  addr = socket.getaddrinfo(host, int(os.environ.get("PGPORT") or 5432), socket.AF_INET,
                                            socket.SOCK_STREAM)[0][4][0]
              except (OSError, ValueError, IndexError) as exc:
                  addr = None
                  print(f"server authentication, negative control (b): FAIL (the pooler's address: {type(exc).__name__})")
              if addr:
                  b = control(f"(b), the host name w03-name-mismatch.invalid at the pooler's address {addr}",
                              {"PGHOST": "w03-name-mismatch.invalid", "PGHOSTADDR": addr}, "does not match host name")
          ok = a and b
          if not ok:
              if os.path.lexists(root):
                  os.remove(root)
              print("server authentication: could not check: server authentication not shown; the root file is removed, "
                    "so nothing after this step connects, and the apply does not run")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"controls={'pass' if ok else 'fail'}\n")
          raise SystemExit(0 if ok else 1)
          PY
      - id: presence
        name: "(2) credential present: yes or no"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "credential present: no"
            echo "present=no" >> "$GITHUB_OUTPUT"
          elif python3 -I -c 'import os, urllib.parse as u; v = u.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""); print("::add-mask::" + v.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'; then
            echo "credential present: yes"
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "credential present: could not check (its percent-encoded form could not be masked); the job stops"
            exit 1
          fi
      - id: connect
        name: "(3) connect"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          if timeout 60 psql -X -q -A -t -c 'select 1' > /dev/null 2> "$RUNNER_TEMP/w03connect.err"; then
            echo "connection: succeeded"
            echo "server authentication, positive control (sslmode=verify-full with the pinned root, select 1): pass"
            echo "connected=yes" >> "$GITHUB_OUTPUT"
          else
            echo "connection: failed"
            echo "server authentication, positive control (sslmode=verify-full with the pinned root, select 1): FAIL"
            echo "server authentication: could not check: server authentication not shown; the apply does not run"
            sed 's/^/psql: /' "$RUNNER_TEMP/w03connect.err"
            echo "connected=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - id: listing
        name: "(4) listing of point 10"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "listing: could not check (a command of this step failed, line ${LINENO})"' ERR
          w="$(mktemp -d)"
          cat > "$w/listing.sql" <<'SQL'
          \set ON_ERROR_STOP on
          begin transaction isolation level repeatable read, read only;
          select (
          select coalesce(json_agg(o order by o), '[]'::json) from (
            select 'schema ' || n.nspname as o
              from pg_catalog.pg_namespace n
             where n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
               and n.nspname <> all (string_to_array(:'ex_schemas', ' '))
               and n.nspname <> all (string_to_array(:'entry_only', ' '))
            union
            select coalesce('extension ' || e.extname,
                            case when c.relkind in ('v', 'm') then 'view ' else 'table ' end || n.nspname || '.' || c.relname)
              from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
              left join pg_catalog.pg_depend d on d.classid = 1259 and d.objid = c.oid and d.deptype = 'e'
              left join pg_catalog.pg_extension e on e.oid = d.refobjid
             where c.relkind in ('r', 'p', 'f', 'v', 'm')
               and n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
               and n.nspname <> all (string_to_array(:'ex_schemas', ' '))
            union
            select coalesce('extension ' || e.extname, 'function ' || n.nspname || '.' || p.proname || '('
                            || pg_catalog.pg_get_function_identity_arguments(p.oid) || ')')
              from pg_catalog.pg_proc p
              join pg_catalog.pg_namespace n on n.oid = p.pronamespace
              left join pg_catalog.pg_depend d on d.classid = 1255 and d.objid = p.oid and d.deptype = 'e'
              left join pg_catalog.pg_extension e on e.oid = d.refobjid
             where n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
               and n.nspname <> all (string_to_array(:'ex_schemas', ' '))
            union
            select 'role ' || r.rolname
              from pg_catalog.pg_roles r
             where r.rolname !~ '^pg_' and r.rolname <> all (string_to_array(:'ex_roles', ' '))
          ) s
          )::text as w03_listing \gset
          \echo W03LISTING :w03_listing
          commit;
          SQL
          echo "listing (W-C02-03 point 10): every schema, table, view, function and role outside Supabase's own"
          echo "  exclusion list, kept as data in this workflow:"
          echo "  schemas excluded with their contents (Supabase's own): ${W03_EXCLUDED_SCHEMAS}"
          echo "  schema entries excluded, their contents still listed: ${W03_SCHEMA_ENTRY_ONLY} (the default schema every project is created with)"
          echo "  roles excluded (Supabase's own), besides every pg_* role: ${W03_EXCLUDED_ROLES}"
          echo "  objects that belong to an extension are listed as that extension"
          timeout 120 psql -X -q -A -t -v ex_schemas="$W03_EXCLUDED_SCHEMAS" -v entry_only="$W03_SCHEMA_ENTRY_ONLY" \
            -v ex_roles="$W03_EXCLUDED_ROLES" -f "$w/listing.sql" > "$w/out" 2> "$w/err" && rc=0 || rc=$?
          timeout 120 psql -X -q -A -t -v ex_schemas= -v entry_only= -v ex_roles= -f "$w/listing.sql" > "$w/control" 2>> "$w/err" || true
          W03_RC=$rc W03_DIR="$w" python3 -I - <<'PY' || exit $?
          import json, os
          def esc(s):
              return "".join(c if c.isprintable() else ascii(c)[1:-1] for c in str(s))
          d = os.environ["W03_DIR"]
          def listing(name):
              for ln in open(os.path.join(d, name), encoding="utf-8"):
                  if ln.startswith("W03LISTING "):
                      try:
                          v = json.loads(ln[len("W03LISTING "):])
                          return v if isinstance(v, list) else None
                      except ValueError:
                          return None
              return None
          items, control = listing("out"), listing("control")
          for ln in open(os.path.join(d, "err"), encoding="utf-8"):
              print("psql: " + esc(ln.rstrip()))
          if os.environ["W03_RC"] != "0" or items is None:
              print("listing: could not check (the read did not complete)")
              count = ""
          else:
              for item in items:
                  print("listing: " + esc(item))
              count = str(len(items))
              print(f"listing: {count} objects outside Supabase's own")
          if control is None:
              print("listing control: could not check (the same query without the exclusion list did not complete)")
          else:
              print(f"listing control: the same query without the exclusion list shows {len(control)} objects; "
                    f"auth.users among them: {'yes' if 'table auth.users' in control else 'no'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={count}\n")
          raise SystemExit(0 if count else 1)
          PY
      - id: dryrun
        name: "(5) dry run: the pending versions"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLI: ${{ steps.cli.outputs.path }}
          W: ${{ steps.workdir.outputs.dir }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "dry run: could not check (a command of this step failed, line ${LINENO})"' ERR
          # The URL holds no password: the tool reads it from PGPASSWORD, its environment, never its arguments (security F6).
          url="$(python3 -I -c 'import os, urllib.parse as u; e = os.environ; print("postgresql://%s@%s:%s/%s?sslmode=verify-full&sslrootcert=/tmp/w03-supabase-root-2021-ca.crt" % (u.quote(e["PGUSER"], safe=""), e["PGHOST"], e["PGPORT"], e["PGDATABASE"]))')"
          "$CLI" --workdir "$W" db push --db-url "$url" --dry-run --yes > "$RUNNER_TEMP/w03dry.out" 2>&1 && rc=0 || rc=$?
          python3 -I -c 'import sys; [print("cli: " + "".join(c if c.isprintable() else ascii(c)[1:-1] for c in ln)) for ln in open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()]' "$RUNNER_TEMP/w03dry.out"
          pending="$(python3 -I -c 'import json, re, sys; print(json.dumps(sorted({m.split("_")[0] for m in re.findall(r"[0-9]+_[^ \n]*\.sql", open(sys.argv[1], encoding="utf-8", errors="replace").read())})))' "$RUNNER_TEMP/w03dry.out")"
          echo "dry run: pending versions: ${pending}"
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"
          echo "dry run: exit ${rc}"
          exit $rc
      - id: apply
        name: "(6) apply to devos-test"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLI: ${{ steps.cli.outputs.path }}
          W: ${{ steps.workdir.outputs.dir }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "apply: could not check (a command of this step failed, line ${LINENO})"' ERR
          # The URL holds no password: the tool reads it from PGPASSWORD, its environment, never its arguments (security F6).
          url="$(python3 -I -c 'import os, urllib.parse as u; e = os.environ; print("postgresql://%s@%s:%s/%s?sslmode=verify-full&sslrootcert=/tmp/w03-supabase-root-2021-ca.crt" % (u.quote(e["PGUSER"], safe=""), e["PGHOST"], e["PGPORT"], e["PGDATABASE"]))')"
          "$CLI" --workdir "$W" db push --db-url "$url" --yes > "$RUNNER_TEMP/w03apply.out" 2>&1 && rc=0 || rc=$?
          python3 -I -c 'import sys; [print("cli: " + "".join(c if c.isprintable() else ascii(c)[1:-1] for c in ln)) for ln in open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()]' "$RUNNER_TEMP/w03apply.out"
          echo "working directory after the command-line tool (names only):"
          (cd "$W" && find . -type f | sort | sed 's/^/  /') || echo "  could not be listed"
          echo "apply: exit ${rc}"
          exit $rc
      - id: compare
        name: "(7) deployment_drift in devos-test, even after a failed apply"
        if: ${{ !cancelled() && steps.head.outputs.head == 'yes' && steps.pooler.outputs.host != '' && steps.tls.outputs.controls == 'pass' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          EXPECTED: ${{ steps.workdir.outputs.expected }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "comparison: could not check (a command of this step failed, line ${LINENO})"' ERR
          w="$(mktemp -d)"
          cat > "$w/compare.sql" <<'SQL'
          \set ON_ERROR_STOP on
          -- The history table, if present, is locked (ACCESS SHARE) before the transaction's snapshot is taken, so that no
          -- TRUNCATE, table-rewriting ALTER TABLE, DROP or other ACCESS EXCLUSIVE command can change it between the reads
          -- and the count. A table that appears after this first read is counted as not locked: the reads are partial.
          select exists (select 1 from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                          where n.nspname = 'supabase_migrations' and c.relname = 'schema_migrations' and c.relkind in ('r', 'p'))
                 as w03_hist_lock \gset
          begin transaction isolation level repeatable read, read only;
          \if :w03_hist_lock
          lock table supabase_migrations.schema_migrations in access share mode;
          \endif
          select r::text as w03_reads, (r->>'function_exists')::boolean as w03_fn,
                 (r->>'history_table_exists')::boolean as w03_hist,
                 (select c.oid from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                   where n.nspname = 'supabase_migrations' and c.relname = 'schema_migrations' and c.relkind in ('r', 'p'))
                   as w03_hist_oid
            from (select json_build_object(
              'function_exists', exists (
                select 1 from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'devos_api' and p.proname = 'deployment_drift' and p.pronargs = 1
                   and p.proargtypes[0] = 3802),
              'history_table_exists', exists (
                select 1 from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'supabase_migrations' and c.relname = 'schema_migrations' and c.relkind in ('r', 'p')),
              'listing', (
                select coalesce(json_agg(o order by o), '[]'::json) from (
                  select 'schema ' || n.nspname as o
                    from pg_catalog.pg_namespace n
                   where n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
                     and n.nspname <> all (string_to_array(:'ex_schemas', ' '))
                     and n.nspname <> all (string_to_array(:'entry_only', ' '))
                  union
                  select coalesce('extension ' || e.extname,
                                  case when c.relkind in ('v', 'm') then 'view ' else 'table ' end || n.nspname || '.' || c.relname)
                    from pg_catalog.pg_class c
                    join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                    left join pg_catalog.pg_depend d on d.classid = 1259 and d.objid = c.oid and d.deptype = 'e'
                    left join pg_catalog.pg_extension e on e.oid = d.refobjid
                   where c.relkind in ('r', 'p', 'f', 'v', 'm')
                     and n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
                     and n.nspname <> all (string_to_array(:'ex_schemas', ' '))
                  union
                  select coalesce('extension ' || e.extname, 'function ' || n.nspname || '.' || p.proname || '('
                                  || pg_catalog.pg_get_function_identity_arguments(p.oid) || ')')
                    from pg_catalog.pg_proc p
                    join pg_catalog.pg_namespace n on n.oid = p.pronamespace
                    left join pg_catalog.pg_depend d on d.classid = 1255 and d.objid = p.oid and d.deptype = 'e'
                    left join pg_catalog.pg_extension e on e.oid = d.refobjid
                   where n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
                     and n.nspname <> all (string_to_array(:'ex_schemas', ' '))
                  union
                  select 'role ' || r.rolname
                    from pg_catalog.pg_roles r
                   where r.rolname !~ '^pg_' and r.rolname <> all (string_to_array(:'ex_roles', ' '))
                ) s
              )) as r) s \gset
          \echo W03READS :w03_reads
          \echo W03LOCKED :w03_hist_lock
          \if :w03_hist
          select coalesce(json_agg(version order by version), '[]')::text as w03_applied, count(*) as w03_rows,
                 'supabase_migrations.schema_migrations'::regclass::oid = :'w03_hist_oid'::oid as w03_same_table
            from supabase_migrations.schema_migrations \gset
          \echo W03APPLIED :w03_applied
          \echo W03ROWS :w03_rows
          \echo W03SAMETABLE :w03_same_table
          \endif
          \if :w03_fn
          select devos_api.deployment_drift(:'expected'::jsonb)::text as w03_drift \gset
          \echo W03DRIFT :w03_drift
          \endif
          commit;
          \echo W03END
          SQL
          timeout "${W03_TIMEOUT:-120}" psql -X -q -A -t -v expected="${EXPECTED:-}" -v ex_schemas="$W03_EXCLUDED_SCHEMAS" \
            -v entry_only="$W03_SCHEMA_ENTRY_ONLY" -v ex_roles="$W03_EXCLUDED_ROLES" -f "$w/compare.sql" > "$w/out" 2> "$w/err" && rc=0 || rc=$?
          W03_RC=$rc W03_DIR="$w" python3 -I - <<'PY' || exit $?
          import json, os
          def esc(s):
              return "".join(c if c.isprintable() else ascii(c)[1:-1] for c in str(s))


          KINDS = {"on_main_not_applied", "applied_not_on_main", "name_differs", "function_missing", "function_extra",
                   "function_differs"}


          def classify(text):
              """deployment_drift's result as the caller reads it (EV-C02-001 section 4): (kind, differences, why)."""
              try:
                  r = json.loads(text)
              except ValueError:
                  return "could_not_check", [], "the result is not JSON"
              if not isinstance(r, dict):
                  return "could_not_check", [], "the result is not an object"
              status, diffs = r.get("status"), r.get("differences")
              if status == "could_not_check":
                  return "could_not_check", [], "deployment_drift answered could_not_check: " + str(r.get("reason", ""))
              if status not in ("no_difference", "differences"):
                  return "could_not_check", [], "the result's status is absent or unknown"
              if r.get("complete") is not True:
                  return "could_not_check", [], "the result's completeness flag is absent or not true"
              if not isinstance(diffs, list) or (status == "no_difference") != (len(diffs) == 0):
                  return "could_not_check", [], "the result's status and its list of differences disagree"
              for x in diffs:
                  key = "slug" if isinstance(x, dict) and str(x.get("kind", "")).startswith("function_") else "version"
                  if not isinstance(x, dict) or x.get("kind") not in KINDS or not isinstance(x.get(key), str):
                      return "could_not_check", [], "the result holds a difference of unknown form"
              return status, diffs, ""

          d, rc = os.environ["W03_DIR"], int(os.environ["W03_RC"])
          out = open(os.path.join(d, "out"), encoding="utf-8").read().splitlines()
          def tagged(tag):
              for ln in out:
                  if ln.startswith(tag + " "):
                      return ln[len(tag) + 1:]
              return None
          reads_text, locked_text, applied_text, rows_text, same_text, drift_text = (
              tagged(t) for t in ("W03READS", "W03LOCKED", "W03APPLIED", "W03ROWS", "W03SAMETABLE", "W03DRIFT"))
          ended = "W03END" in out
          try:
              reads = json.loads(reads_text) if reads_text else None
          except ValueError:
              reads = None
          fm_reads, applied = "", "null"
          if isinstance(reads, dict):
              # The row count is read from the table itself in the same transaction (one snapshot), and only counts if the
              # table was locked before the snapshot (W03LOCKED) and the table it counted is the one the snapshot's catalog
              # read saw (W03SAMETABLE: the same oid); otherwise, or if the count was not read, the reads are partial
              # (EV-C02-001 section 5 as changed after P13).
              hist = reads.get("history_table_exists") is True
              complete = not hist or (locked_text == "t" and applied_text is not None and (rows_text or "").isdigit()
                                          and same_text == "t")
              reads.update(complete=complete, snapshot="repeatable_read_transaction",
                           history_rows=int(rows_text) if hist and complete else None)
              fm_reads = json.dumps(reads, separators=(",", ":"))
              if hist and complete:
                  applied = applied_text
          if not isinstance(reads, dict):
              call = "timeout" if rc == 124 else "not_called"
          elif reads.get("function_exists") is not True:
              call = "not_called"
          elif rc == 124:
              call = "timeout"
          elif rc == 0 and ended and drift_text is not None:
              call = "ok"
          else:
              call = "error"
          result_json = drift_text if call == "ok" else ""
          kind, diffs, why = classify(result_json) if call == "ok" else ("could_not_check", [], f"call={call}")
          for ln in open(os.path.join(d, "err"), encoding="utf-8"):
              print("psql: " + esc(ln.rstrip()))
          project = os.environ.get("PROJECT", "")
          if isinstance(reads, dict):
              print(f"reads in {project} (one read-only REPEATABLE READ transaction): function_exists={reads['function_exists']} "
                    f"history_table_exists={reads['history_table_exists']} history_rows={reads['history_rows']} "
                    f"listing={len(reads.get('listing') or [])} objects complete={reads['complete']}")
          else:
              print(f"reads in {project}: could not check (the reads did not complete)")
          print(f"comparison in {project}: result={kind} call={call}" + (f" ({why})" if why else ""))
          for x in diffs:
              print(f"comparison in {project}: {esc(x.get('kind'))} {esc(x.get('version') or x.get('slug'))}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for k, v in (("fm_reads", fm_reads), ("call", call), ("result_json", result_json), ("result", kind),
                           ("applied", applied)):
                  f.write(f"{k}<<W03EOF\n{v}\nW03EOF\n")
          PY
      - id: dbtests
        name: "(8) database tests, only after a clean comparison"
        if: ${{ steps.compare.outputs.result == 'no_difference' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          python3 -I - <<'PY' || exit $?
          # The database tests (EV-C02-001 M09; T-W03-06, T-W03-07): each file supabase/migrations/tests/<name>.sql, in name
          # order, run as written with psql, errors stopping the file; it passes only on exit 0 and its "NOTICE: <NAME> PASS ("
          # line. Only a regular file whose name is lower-case letters, digits and underscores, then .sql, is run; any other
          # .sql name is "could not check" and is not run. A file holding a backslash is refused (every psql meta-command begins
          # with one). No file name, path or content is put into a shell, sed or other program here: the name is matched by a
          # fixed pattern, the content is searched as bytes, and psql gets the path as an argument. Output lines are printed
          # with the file's name, control characters escaped.
          import os, re, subprocess
          DIR = "supabase/migrations/tests"
          NAME = re.compile(r"[a-z0-9_]+\.sql")


          def esc(s):
              return "".join(c if c.isprintable() else ascii(c)[1:-1] for c in s)


          names = sorted(n for n in os.listdir(DIR) if n.lower().endswith(".sql")) if os.path.isdir(DIR) else []
          if not names:
              print("database tests: none")
              raise SystemExit(0)
          failed = False
          for n in names:
              path = os.path.join(DIR, n)
              if not NAME.fullmatch(n) or os.path.islink(path) or not os.path.isfile(path):
                  print(f"database test {esc(n)}: could not check (only a regular file named [a-z0-9_]+.sql is run); not run")
                  failed = True
                  continue
              with open(path, "rb") as f:
                  if b"\\" in f.read():
                      print(f"database test {n}: refused, it holds a backslash (a psql meta-command would run with the credential "
                            f"in reach)")
                      failed = True
                      continue
              r = subprocess.run(["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", path], stdin=subprocess.DEVNULL,
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              out = r.stdout.decode("utf-8", "replace")
              for ln in out.splitlines():
                  print(f"{n}: {esc(ln)}")
              if r.returncode == 0 and re.search(r"NOTICE: +[A-Z0-9_]+ PASS \(", out):
                  print(f"database test {n}: passed")
              else:
                  print(f"database test {n}: not passed (psql exit {r.returncode})")
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY
      - id: tokens
        name: "(8) synthetic tokens for the test programs, if any, issued as owner"
        if: ${{ steps.dbtests.outcome == 'success' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          programs=(supabase/migrations/tests/*.py)
          if [ ${#programs[@]} -eq 0 ]; then
            echo "synthetic tokens: none issued (no test program)"
            exit 0
          fi
          umask 077
          python3 -I - <<'PY' || exit $?
          # N-255 (2): as owner, one synthetic token per role class the tests use (W03_TOKEN_CLASSES, EV-C02-003 section 4.1's
          # columns) and one more, of the first class, revoked before the programs run: the "revoked token". Issued with
          # devos_private.issue_env_token(role_class), revoked with devos_private.revoke_env_token(token) (B:46; EV-C02-003
          # section 6.3). Each token is masked before anything else is printed, and is never printed; the file (0600, under
          # the runner's temporary directory) is rewritten after every issue, so that the step that revokes them, which runs
          # in every case, finds every token issued before a failure or a cancellation. A token reaches psql only through its
          # environment (psql's \getenv), never through a command line.
          import json, os, subprocess
          path = os.path.join(os.environ["RUNNER_TEMP"], "w03tokens.json")
          classes = os.environ["W03_TOKEN_CLASSES"].split()
          state = {"tokens": {}, "revoked_token": None, "revoked_before_programs": False}
          def save():
              with open(path + ".tmp", "w", encoding="utf-8") as f:
                  json.dump(state, f)
              os.replace(path + ".tmp", path)
          def psql(sql, args=(), env=None):
              return subprocess.run(["psql", "-X", "-q", "-A", "-t", "-v", "ON_ERROR_STOP=1", *args, "-f", "-"],
                                    input=sql, capture_output=True, text=True, env={**os.environ, **(env or {})})
          def issue(role_class):
              r = psql("select devos_private.issue_env_token(:'rc');\n", ("-v", f"rc={role_class}"))
              token = r.stdout.strip()
              if r.returncode or not token or "\n" in token:
                  return None, r.returncode
              print("::add-mask::" + token.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), flush=True)
              return token, 0
          ok = True
          for role_class in classes:
              token, rc = issue(role_class)
              if token is None:
                  print(f"synthetic token for {role_class}: not issued (psql exit {rc})")
                  ok = False
                  continue
              state["tokens"][role_class] = token
              save()
              print(f"synthetic token for {role_class}: issued")
          token, rc = issue(classes[0])
          if token is None:
              print(f"revoked token ({classes[0]}): not issued (psql exit {rc})")
              ok = False
          else:
              state["revoked_token"] = token
              save()
              r = psql("\\getenv tok W03_TOKEN\nselect devos_private.revoke_env_token(:'tok');\n", env={"W03_TOKEN": token})
              state["revoked_before_programs"] = r.returncode == 0
              save()
              print(f"revoked token ({classes[0]}): issued and " + ("revoked" if r.returncode == 0 else
                                                                    f"NOT revoked (psql exit {r.returncode})"))
              ok = ok and r.returncode == 0
          raise SystemExit(0 if ok else 1)
          PY
      - id: dbprograms
        name: "(8) test programs, in name order: input on standard input, an empty environment, the database only if declared"
        if: ${{ steps.dbtests.outcome == 'success' && steps.tokens.outcome == 'success' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DEVOS_TEST_PUBLISHABLE_KEY: ${{ secrets.DEVOS_TEST_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          python3 -I - <<'PY' || exit $?
          # N-255: runs supabase/migrations/tests/*.py in name order, after the SQL database tests, in devos-test only. Each
          # program gets one JSON object on standard input: {"endpoint", "apikey", "tokens", "revoked_token"}. It runs with
          # an environment built from nothing (env -i's effect) holding PATH, HOME (a new empty directory) and LANG only,
          # unless a line "# w07-needs-database: yes" among its first ten lines declares that it needs the database; then it
          # also gets this step's own connection settings in libpq's variables (PGHOST, PGPORT, PGUSER, PGDATABASE,
          # PGPASSWORD, and PGSSLMODE and PGSSLROOTCERT so that it authenticates the server as this step does), never on a
          # command line. The environment is passed to the process directly rather than as env -i's NAME=VALUE arguments,
          # so the password is in no process's arguments. Exit 0 pass, 1 fail, 3 could not check, anything else fail. The
          # report line per program gives its name and result only; this step prints no token, key or password.
          import glob, json, os, re, subprocess, tempfile
          programs = sorted(glob.glob("supabase/migrations/tests/*.py"))
          if not programs:
              print("test programs: none")
              raise SystemExit(0)
          try:
              with open(os.path.join(os.environ["RUNNER_TEMP"], "w03tokens.json"), encoding="utf-8") as f:
                  state = json.load(f)
              tokens, revoked = state["tokens"], state["revoked_token"]
              assert isinstance(tokens, dict) and tokens and isinstance(revoked, str) and state["revoked_before_programs"]
          except (OSError, ValueError, KeyError, TypeError, AssertionError):
              print("test programs: could not check (the synthetic tokens are not all there); no program runs")
              raise SystemExit(1)
          # The Data API endpoint, derived from the project reference in this job's connection settings: the pooler user
          # is postgres.<project ref> (EV-C02-001 M19), and the project's URL is https://<project ref>.supabase.co
          # (EV-C02-003, "Names this design fixes"). If it cannot be derived, null, and the programs report "could not check".
          m = re.fullmatch(r"postgres\.([a-z]{20})", os.environ.get("PGUSER", ""))
          endpoint = f"https://{m.group(1)}.supabase.co" if m else None
          apikey = os.environ.get("DEVOS_TEST_PUBLISHABLE_KEY") or None
          print(f"test programs: {len(programs)}; endpoint {endpoint or 'null (not derivable)'}; publishable key "
                f"{'set' if apikey else 'not set (null)'}; tokens for {sorted(tokens)} and one revoked token", flush=True)
          payload = json.dumps({"endpoint": endpoint, "apikey": apikey, "tokens": tokens, "revoked_token": revoked})
          DB_VARS = ("PGHOST", "PGPORT", "PGUSER", "PGDATABASE", "PGPASSWORD", "PGSSLMODE", "PGSSLROOTCERT")
          failed = False
          for p in programs:
              with open(p, encoding="utf-8", errors="replace") as f:
                  head = [f.readline() for _ in range(10)]
              needs_db = any(ln.strip() == "# w07-needs-database: yes" for ln in head)
              home = tempfile.mkdtemp(prefix="w03prog-", dir=os.environ["RUNNER_TEMP"])
              env = {"PATH": "/usr/bin:/bin", "HOME": home, "LANG": "C.UTF-8"}
              if needs_db:
                  env.update({k: os.environ[k] for k in DB_VARS if os.environ.get(k)})
              try:
                  rc = subprocess.run(["timeout", "600", "python3", "-I", p], input=payload, text=True, env=env).returncode
              except OSError:
                  rc = -1
              result = {0: "pass", 1: "fail", 3: "could not check"}.get(rc, "fail")
              failed = failed or rc != 0
              name = "".join(c if c.isprintable() else ascii(c)[1:-1] for c in os.path.basename(p))
              print(f"test program {name}: {result}", flush=True)
          raise SystemExit(1 if failed else 0)
          PY
      - id: tokens_revoke
        name: "(8) revoke every synthetic token issued, in every case"
        if: ${{ always() }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          f="$RUNNER_TEMP/w03tokens.json"
          if [ ! -f "$f" ]; then
            echo "synthetic tokens: none to revoke"
            exit 0
          fi
          python3 -I - "$f" <<'PY' && rc=0 || rc=$?
          # Revoked with devos_private.revoke_env_token, called with the token (EV-C02-003 section 6.3). That argument form is
          # assumed here; W-C02-09 fixes the function's signature, and this step is changed with it if it differs. The
          # revoked token is revoked again only if its revocation before the programs did not succeed. A token reaches
          # psql only through its environment (psql's \getenv), never through a command line.
          import json, os, subprocess, sys
          state = json.load(open(sys.argv[1], encoding="utf-8"))
          todo = list(state.get("tokens", {}).items())
          if state.get("revoked_token") and not state.get("revoked_before_programs"):
              todo.append(("the revoked token", state["revoked_token"]))
          elif state.get("revoked_token"):
              print("revoked token: already revoked before the programs")
          bad = 0
          for role_class, token in todo:
              r = subprocess.run(["psql", "-X", "-q", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-f", "-"],
                                 input="\\getenv tok W03_TOKEN\nselect devos_private.revoke_env_token(:'tok');\n",
                                 capture_output=True, text=True, env={**os.environ, "W03_TOKEN": token})
              print(f"synthetic token for {role_class}: {'revoked' if r.returncode == 0 else 'NOT revoked'}")
              bad += r.returncode != 0
          raise SystemExit(1 if bad else 0)
          PY
          rm -f "$f"
          exit $rc
      - id: go
        name: "go = yes only after the apply, a clean comparison and the tests"
        if: ${{ always() }}
        env:
          HEAD_STATE: ${{ steps.head.outputs.head }}
          APPLY: ${{ steps.apply.outcome }}
          RESULT: ${{ steps.compare.outputs.result }}
          TESTS: ${{ steps.dbtests.outcome }}
          PROGRAMS: ${{ steps.dbprograms.outcome }}
          REVOKED: ${{ steps.tokens_revoke.outcome }}
        shell: bash
        run: |
          if [ "$HEAD_STATE" != "yes" ]; then
            go="${HEAD_STATE:-no}"
          elif [ "$APPLY" = "success" ] && [ "$RESULT" = "no_difference" ] && [ "$TESTS" = "success" ] \
               && [ "$PROGRAMS" = "success" ] && [ "$REVOKED" = "success" ]; then
            go="yes"
          else
            go="no"
          fi
          echo "devos-test go=${go} (head=${HEAD_STATE:-none} apply=${APPLY:-none} comparison=${RESULT:-none} tests=${TESTS:-none} programs=${PROGRAMS:-none} revocation=${REVOKED:-none})"
          echo "go=${go}" >> "$GITHUB_OUTPUT"
      - id: report
        name: "report (names, versions, counts and statuses only)"
        if: ${{ always() }}
        env:
          HEAD_STATE: ${{ steps.head.outputs.head }}
          PRESENT: ${{ steps.presence.outputs.present }}
          CONNECTED: ${{ steps.connect.outputs.connected }}
          LISTING_COUNT: ${{ steps.listing.outputs.count }}
          RESULT: ${{ steps.compare.outputs.result }}
          RESULT_JSON: ${{ steps.compare.outputs.result_json }}
          APPLIED: ${{ steps.compare.outputs.applied }}
          APPLY: ${{ steps.apply.outcome }}
          GO: ${{ steps.go.outputs.go }}
        shell: python
        run: |
          import json, os
          e = os.environ
          def load(text, default):
              try:
                  return json.loads(text) if text else default
              except ValueError:
                  return default
          def project_state(result, result_json, applied):
              r = load(result_json, {})
              diffs = r.get("differences") if isinstance(r, dict) and isinstance(r.get("differences"), list) else []
              return {"result": result or "could_not_check",
                      "differences": [{k: x[k] for k in ("kind", "version", "slug") if k in x} for x in diffs],
                      "applied_versions": load(applied, None)}
          after = e.get("AFTER_RESULT", "")
          state = project_state(after, e.get("AFTER_JSON", ""), e.get("AFTER_APPLIED", "")) if after else \
              project_state(e.get("RESULT", ""), e.get("RESULT_JSON", ""), e.get("APPLIED", ""))
          report = {"project": e["PROJECT"], "event": e["GITHUB_EVENT_NAME"], "run_id": e["GITHUB_RUN_ID"],
                    "commit": e["GITHUB_SHA"], "head": e.get("HEAD_STATE") or "none",
                    "credential_present": e.get("PRESENT") or "none", "connection": e.get("CONNECTED") or "none",
                    "listing_count": e.get("LISTING_COUNT") or None, **state}
          for k, name in (("GO", "go"), ("APPLY", "apply_step"), ("DECIDE_APPLY", "apply"), ("DECIDE_REASON", "reason"),
                          ("EXCEPTION", "first_migration_exception"), ("BEFORE_RESULT", "result_before_apply")):
              if e.get(k) is not None:
                  report[name] = e.get(k) or "none"
          line = json.dumps(report, separators=(",", ":"))
          print("W03REPORT", line)
          if e.get("GITHUB_STEP_SUMMARY"):
              with open(e["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(f"### Migration report: {report['project']}\n\n```\n{line}\n```\n")

  devos:
    name: devos (compare, decide, apply)
    needs: devos-test
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: migrate-devos
    permissions:
      contents: read
    env:
      PROJECT: devos
      PROJECT_REF: zyqgltzfzkdvrmvxlamz
      POOLER_HOST: "aws-0-us-east-1.pooler.supabase.com"  # P3: found by run 38315433827 (2026-10-12) without the credential; EV-C02-007 section 13
      PGPORT: "5432"
      PGUSER: postgres.zyqgltzfzkdvrmvxlamz
      PGDATABASE: postgres
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tmp/w03-supabase-root-2021-ca.crt  # written by step rootca, after its pin is checked
      PGCONNECT_TIMEOUT: "15"
      PGAPPNAME: devos-migrate
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - id: head
        name: "(1) head check: act only at main's head (M05)"
        shell: bash
        run: |
          main_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)" || main_head=""
          if [ -z "$main_head" ]; then
            echo "head check: could not check (main's head could not be read); nothing connects"
            echo "head=unknown" >> "$GITHUB_OUTPUT"
          elif [ "$main_head" = "$GITHUB_SHA" ]; then
            echo "head check: yes (this run's commit ${GITHUB_SHA} is main's head)"
            echo "head=yes" >> "$GITHUB_OUTPUT"
          else
            echo "head check: superseded (this run's commit ${GITHUB_SHA}; main's head ${main_head}); nothing connects"
            echo "head=superseded" >> "$GITHUB_OUTPUT"
          fi
      - id: checkout
        name: "check out this commit (no credential kept)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0, a commit of actions/checkout (P12)
        with:
          persist-credentials: false
      - id: cli
        name: "install the command-line tool, its checksum checked (M20, P12)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "command-line tool v${CLI_VERSION}: could not check (a command of this step failed, line ${LINENO}); no step that runs it runs"' ERR
          d="$RUNNER_TEMP/w03cli"
          rm -rf "$d"
          mkdir -p "$d"
          if ! curl -fsSL --proto '=https' --tlsv1.2 -o "$d/cli.tar.gz" \
              "https://github.com/supabase/cli/releases/download/v${CLI_VERSION}/supabase_linux_amd64.tar.gz"; then
            echo "command-line tool v${CLI_VERSION}: could not check (the download failed); it is not extracted, and no step that runs it runs"
            exit 1
          fi
          if ! printf '%s  %s\n' "$CLI_SHA256" "$d/cli.tar.gz" | sha256sum --check --status; then
            echo "command-line tool v${CLI_VERSION}: checksum MISMATCH; the tool is not extracted, and no step that runs it runs"
            exit 1
          fi
          echo "command-line tool v${CLI_VERSION}: checksum matches the release's published SHA-256 ${CLI_SHA256}"
          if ! tar -xzf "$d/cli.tar.gz" -C "$d" supabase supabase-go; then
            echo "command-line tool v${CLI_VERSION}: could not check (the archive did not extract); no step that runs it runs"
            exit 1
          fi
          echo "path=$d/supabase" >> "$GITHUB_OUTPUT"
      - id: workdir
        name: "build the tool's working directory; expected from main's head (M08, M14, Y-09)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          trap 'echo "expected: could not check (a command of this step failed, line ${LINENO})"' ERR
          w="$RUNNER_TEMP/w03work"
          rm -rf "$w"
          mkdir -p "$w/supabase/migrations"
          printf '%s\n' "$W03_CLI_CONFIG" > "$w/supabase/config.toml"
          python3 -I - "$w" <<'PY'
          # M08 and Y-09: the command-line tool runs in a directory this step builds: the workflow's own configuration and
          # copies of the top-level migration files only. M14: `expected` from the same files at this commit (main's head).
          import json, os, re, shutil, sys
          w = sys.argv[1]
          src = "supabase/migrations"
          pattern = re.compile(r"([0-9]+)_(.*)\.sql")
          migrations, problems = [], []
          if os.path.lexists("supabase/functions"):
              problems.append("supabase/functions/ exists; its part of the comparison comes with the first Edge Function (N-230)")
          for name in sorted(os.listdir(src)) if os.path.isdir(src) else []:
              path = os.path.join(src, name)
              if os.path.islink(path):
                  problems.append(f"{path} is a symbolic link")
              elif os.path.isdir(path):
                  continue  # subdirectories (tests/) hold no migrations
              elif not pattern.fullmatch(name):
                  problems.append(f"{path} is a top-level file that is not a migration (<version>_<name>.sql)")
              else:
                  match = pattern.fullmatch(name)
                  shutil.copyfile(path, os.path.join(w, "supabase", "migrations", name))
                  migrations.append({"version": match.group(1), "name": match.group(2)})
          versions = [m["version"] for m in migrations]
          if len(set(versions)) != len(versions):
              problems.append("two migration files share a version")
          print("working directory of the command-line tool (names only):")
          for root, _, files in sorted(os.walk(w)):
              for f in sorted(files):
                  print("  " + os.path.relpath(os.path.join(root, f), w))
          expected = "" if problems else json.dumps(
              {"commit": os.environ["GITHUB_SHA"], "migrations": migrations, "functions": []}, separators=(",", ":"))
          for p in problems:
              print("expected: could not check: " + p)
          print(f"expected: {len(migrations)} migrations on main at {os.environ['GITHUB_SHA']}: {versions}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dir={w}\nexpected<<W03EOF\n{expected}\nW03EOF\n")
          PY
      - id: rootca
        name: "server authentication: the pinned root certificate, written only if its SHA-256 matches (security F5)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          python3 -I - <<'PY' || exit $?
          # Every connection of this job uses sslmode=verify-full against the root file PGSSLROOTCERT names (the job's env).
          # That root is the Supabase Root 2021 CA, kept in this workflow (W03_ROOT_CA_PEM) and pinned by the SHA-256 of its
          # DER (W03_ROOT_CA_SHA256). The file is written only if the PEM holds exactly one certificate with that SHA-256,
          # and it is written from that DER, so it holds nothing else. Otherwise no file exists, and nothing connects:
          # libpq and the command-line tool both refuse a missing root file under verify-full.
          import hashlib, os, ssl
          path, pin = os.environ["PGSSLROOTCERT"], os.environ.get("W03_ROOT_CA_SHA256", "")
          if os.path.lexists(path):
              os.remove(path)
          pem = os.environ.get("W03_ROOT_CA_PEM", "").strip()
          try:
              if pem.count("-----BEGIN") != 1:
                  raise ValueError("the PEM does not hold exactly one certificate")
              der = ssl.PEM_cert_to_DER_cert(pem)
          except ValueError as exc:
              print(f"server root certificate: could not check ({exc}); no file is written, and nothing connects")
              raise SystemExit(1)
          got = hashlib.sha256(der).hexdigest()
          if got != pin:
              print(f"server root certificate: could not check: the SHA-256 of its DER is {got}, not the pin {pin}; "
                    f"no file is written, and nothing connects")
              raise SystemExit(1)
          with open(path, "x", encoding="ascii") as f:
              f.write(ssl.DER_cert_to_PEM_cert(der))
          with open(path, encoding="ascii") as f:
              back = f.read().strip()
          if back.count("-----BEGIN") != 1 or hashlib.sha256(ssl.PEM_cert_to_DER_cert(back)).hexdigest() != pin:
              os.remove(path)
              print("server root certificate: could not check (the file written does not read back as the pinned "
                    "certificate); it is removed, and nothing connects")
              raise SystemExit(1)
          print(f"server root certificate: the SHA-256 of its DER, {got}, matches the pin; written to {path}")
          PY
      - id: pooler
        name: "find the pooler host without the credential (P3)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        shell: bash
        run: |
          if [ -n "$POOLER_HOST" ]; then
            echo "pooler host (P3): ${POOLER_HOST} (recorded in the workflow)"
            echo "host=${POOLER_HOST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pooler host (P3): not recorded in the workflow; looking for it without the credential"
          found=""
          answers="$RUNNER_TEMP/w03pooler.answers"
          : > "$answers"
          for h in $W03_POOLER_CANDIDATES; do
            msg="$(env -u PGPASSWORD PGHOST="$h" timeout 20 psql -X -w -A -t -c 'select 1' 2>&1 >/dev/null)" && rc=0 || rc=$?
            printf '%s\0%s\0%s\0' "$h" "$rc" "$msg" >> "$answers"
            case "$msg" in
              *"Tenant or user not found"*) ;;
              *password*) found="$h"; break ;;
            esac
          done
          python3 -I - "$answers" <<'PY' || echo "pooler host (P3): the candidates' answers could not be listed"
          # The distinct answers the candidates gave (CHK-C02-029 F-2): each once, with how many gave it and the first that did,
          # the host and its address replaced, escaped. So a run that finds none tells a chain that does not verify against the
          # pinned root ("certificate verify failed") from no region holding the project ("Tenant or user not found"), from a
          # timeout (exit 124) and from a name that does not resolve. This step holds no secret.
          import re, sys
          fields = open(sys.argv[1], "rb").read().decode("utf-8", "replace").split("\0")
          kinds = {}
          for i in range(0, len(fields) - 2, 3):
              host, rc, msg = fields[i:i + 3]
              text = re.sub(r"\((?:[0-9]{1,3}\.){3}[0-9]{1,3}\)|\([0-9a-fA-F]*:[0-9a-fA-F:]*\)", "(<address>)",
                            msg.replace(host, "<host>"))
              kinds.setdefault(f"exit {rc}: " + (" ".join(text.split()) or "(no message)"), []).append(host)
          for kind, hosts in kinds.items():
              shown = "".join(c if c.isprintable() else ascii(c)[1:-1] for c in kind)[:300]
              print(f"pooler host (P3): {len(hosts)} candidate(s) answered, the first {hosts[0]}: {shown}")
          PY
          echo "pooler host (P3): found ${found:-none}; it is not used until it is recorded in the workflow (EV-C02-001 M19)"
          echo "host=" >> "$GITHUB_OUTPUT"
          exit 1
      - id: tls
        name: "server authentication: two negative controls, without the credential, before it is used (security F5)"
        if: ${{ steps.head.outputs.head == 'yes' }}
        env:
          PGHOST: ${{ steps.pooler.outputs.host }}
        shell: bash
        run: |
          set -uo pipefail
          python3 -I - <<'PY' || exit $?
          # The first-run controls of server authentication, before any step that holds the credential connects. Neither
          # control holds the password (PGPASSWORD removed, psql -w), so one that wrongly connects reaches at most the
          # server's password request. Each keeps this job's own PGSSLMODE and PGSSLROOTCERT but for the one part it
          # changes: (a) a root made at run time in place of the pinned one must give "certificate verify failed"; (b) a
          # host name the certificate does not cover, at the pooler's own address (hostaddr), must give "does not match
          # host name". The positive control is step connect (select 1, with the credential). If a control is not refused
          # for its reason, server authentication is not shown: the root file is removed, so no later step can connect,
          # and this step fails, so the apply does not run. Each control prints one line, holding no secret.
          import os, socket, subprocess, tempfile


          def esc(s):
              return "".join(c if c.isprintable() else ascii(c)[1:-1] for c in s)


          def control(label, change, marker):
              env = {k: v for k, v in os.environ.items() if k != "PGPASSWORD"}
              env.update(change)
              try:
                  r = subprocess.run(["psql", "-X", "-w", "-A", "-t", "-c", "select 1"], env=env, stdin=subprocess.DEVNULL,
                                     capture_output=True, text=True, timeout=60)
                  rc, msg = r.returncode, " ".join((r.stdout + r.stderr).split())
              except (OSError, subprocess.TimeoutExpired) as exc:
                  rc, msg = None, type(exc).__name__
              if rc == 0:
                  line = "FAIL (it connected)"
              elif rc is not None and marker in msg:
                  line = f"pass (refused: {marker})"
              else:
                  line = f"FAIL (not refused for that reason: {esc(msg)[:240]})"
              print(f"server authentication, negative control {label}: {line}", flush=True)
              return line.startswith("pass")


          root, host = os.environ["PGSSLROOTCERT"], os.environ.get("PGHOST", "")
          a = b = False
          if not host or not os.path.isfile(root):
              print("server authentication: could not check (no pooler host, or no pinned root file)")
          else:
              with tempfile.TemporaryDirectory() as d:
                  made = subprocess.run(["openssl", "req", "-x509", "-newkey", "ec", "-pkeyopt", "ec_paramgen_curve:prime256v1",
                                         "-nodes", "-keyout", d + "/runtime-root.key", "-out", d + "/runtime-root.crt",
                                         "-days", "1", "-subj", "/CN=w03 run-time root"], capture_output=True).returncode == 0
                  if made:
                      a = control("(a), a root made at run time in place of the pinned one",
                                  {"PGSSLROOTCERT": d + "/runtime-root.crt"}, "certificate verify failed")
                  else:
                      print("server authentication, negative control (a): FAIL (openssl could not make the run-time root)")
              try:
                  addr = socket.getaddrinfo(host, int(os.environ.get("PGPORT") or 5432), socket.AF_INET,
                                            socket.SOCK_STREAM)[0][4][0]
              except (OSError, ValueError, IndexError) as exc:
                  addr = None
                  print(f"server authentication, negative control (b): FAIL (the pooler's address: {type(exc).__name__})")
              if addr:
                  b = control(f"(b), the host name w03-name-mismatch.invalid at the pooler's address {addr}",
                              {"PGHOST": "w03-name-mismatch.invalid", "PGHOSTADDR": addr}, "does not match host name")
          ok = a and b
          if not ok:
              if os.path.lexists(root):
                  os.remove(root)
              print("server authentication: could not check: server authentication not shown; the root file is removed, "
                    "so nothing after this step connects, and the apply does not run")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"controls={'pass' if ok else 'fail'}\n")
          raise SystemExit(0 if ok else 1)
          PY
      - id: presence
