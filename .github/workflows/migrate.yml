    name: check-devos-test (compare and search; applies nothing)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: migrate-devos-test
    permissions:
      contents: read
      issues: read
      actions: read
    env:
      PROJECT: devos-test
      PROJECT_REF: cqbzxexxwrrbrlszoseg
      POOLER_HOST: ""  # P3: recorded here once found; empty until then, so nothing connects
      PGPORT: "5432"
      PGUSER: postgres.cqbzxexxwrrbrlszoseg
      PGDATABASE: postgres
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "15"
      PGAPPNAME: devos-migrate
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
