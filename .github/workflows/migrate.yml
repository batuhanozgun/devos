        shell: python
        run: |
          # Point 9's search (EV-C02-001 section 10; tests/C02/W-C02-03/T-W03-09_credential_search.md). This step holds this
          # job's own project's value. Everything it reads is data: it is only counted with a fixed-string count, never run,
          # evaluated or put into a command. It prints counts only, per place and per form (plain, percent-encoded).
          import base64, io, json, os, subprocess, tempfile, urllib.error, urllib.parse, urllib.request, zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
