      - id: guards
        name: "the fixtures' own guards, in a scratch database (this rehearsal's own; each file run with psql, not the tool)"
        if: ${{ !cancelled() }}
        env:
          PGDATABASE: w03a3_scratch
        shell: bash
        run: |
          set -euo pipefail
          fx=.github/w03-a3/fixtures
          h4="$fx/20261012232112_w03_fixture_name_differs.sql"
          h5="$fx/20261012232113_w03_fixture_restore_name.sql"
          q() { psql -X -q -A -t -v ON_ERROR_STOP=1 -c "$1"; }
          q "create schema supabase_migrations"
          q "create table supabase_migrations.schema_migrations (version text primary key, statements text[], name text)"
          q "insert into supabase_migrations.schema_migrations (version, name) values ('20261012231841', 'w03_fixture_apply')"
          echo "guards: database w03a3_scratch; history table as H1-prime's rehearsal stubbed it; one row: 20261012231841 w03_fixture_apply"
          bad=0
          check() {  # label, file, expected psql exit, expected name(s) of 20261012231841's row after, text the output must hold
            local out rc names verdict
            out="$(psql -X -q -v ON_ERROR_STOP=1 -1 -f "$2" 2>&1)" && rc=0 || rc=$?
            if [ -n "$out" ]; then printf '%s\n' "$out" | sed 's/^/  psql: /'; fi
            names="$(q "select coalesce(string_agg(name, ',' order by name), '(none)') from supabase_migrations.schema_migrations where version = '20261012231841'")"
            if [ "$rc" = "$3" ] && [ "$names" = "$4" ] && [[ "$out" == *"$5"* ]]; then verdict="as expected"; else verdict="NOT as expected"; bad=1; fi
            echo "guards: $1: psql exit ${rc}; the row of 20261012231841 after: ${names}; expected exit $3, ${4}${5:+ and '$5'}: ${verdict}"
          }
          check "(control) H4 on the row named w03_fixture_apply" "$h4" 0 w03_fixture_apply_renamed ""
          check "(guard) H4 on the row already renamed" "$h4" 3 w03_fixture_apply_renamed "renamed 0"
          check "(control) H5 on the renamed row" "$h5" 0 w03_fixture_apply ""
          q "delete from supabase_migrations.schema_migrations"
          echo "guards: every history row deleted"
          check "(guard) H5 with no row of 20261012231841" "$h5" 3 "(none)" "found 0"
          exit $bad
